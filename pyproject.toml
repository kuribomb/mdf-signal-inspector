[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdf-signal-inspector"
version = "0.1.0"
description = "MDF4ファイルの信号固着検出ツール"
requires-python = ">=3.11"
dependencies = [
    "asammdf>=7.0",
    "numpy>=2.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
]

[project.gui-scripts]
mdf-signal-inspector = "mdf_signal_inspector.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
